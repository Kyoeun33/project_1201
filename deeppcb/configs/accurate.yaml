data_root: data
split_csv: runs/splits.csv
runs_dir: runs
seed: 42
device: auto  # auto | cpu | cuda
model:
  fpn_channels: 128
  anchors: [[8, 16], [16, 32], [32, 64], [64, 128], [128, 256]]
  nms_iou: 0.50
training:
  epochs: 30
  early_stopping_patience: 7
  batch_images: 1
  learning_rate: 0.0001
  augmentation: false
